import groovy.xml.XmlParser
import groovy.xml.XmlNodePrinter

apply plugin: "java"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
sourceSets.main.java.srcDirs = [ "src/" ]

project.ext.mainClassName = "com.udacity.gamedev.firstdemo.desktop.DesktopLauncher"
project.ext.assetsDir = rootProject.file("android/assets")

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    if (project.assetsDir.exists()) {
        workingDir = project.assetsDir
    }
    ignoreExitValue = true
}

tasks.register('dist', Jar) {
    dependsOn classes
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    if (project.assetsDir.exists()) {
        from files(project.assetsDir)
    }
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
}

eclipse {
    project {
        name = appName + "-desktop"
        linkedResource name: 'assets', type: '2', location: 'PARENT-1-PROJECT_LOC/android/assets'
    }
}

tasks.register('afterEclipseImport') {
    description = "Post processing after project generation"
    group = "IDE"
    doLast {
        def classpath = new XmlParser().parse(file(".classpath"))
        new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ])
        def writer = new FileWriter(file(".classpath"))
        def printer = new XmlNodePrinter(new PrintWriter(writer))
        printer.setPreserveWhitespace(true)
        printer.print(classpath)
    }
}
