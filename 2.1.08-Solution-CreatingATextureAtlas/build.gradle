import com.badlogic.gdx.tools.texturepacker.TexturePacker
buildscript {
    ext.kotlinVersion = '2.2.20'
    repositories {
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.badlogicgames.gdx:gdx-tools:1.7.0"
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "TextureAtlas"
        gdxVersion = '1.7.2'
        roboVMVersion = '1.12.0'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.7.0'
        kotlinVersion = '2.2.20'
    }

    repositories {
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

project(":desktop") {
    apply plugin: "java"

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java-library"
    apply plugin: "kotlin"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    }

    tasks.register('packTextures') {
        def pack = rootProject.file("android/assets/images/gigagal.pack.png")
        def atlas = rootProject.file("android/assets/images/gigagal.pack.atlas")

        doLast {
            pack.delete()
            atlas.delete()
            TexturePacker.process(
                rootProject.file("core/rawAssets/sprites").absolutePath,
                rootProject.file("android/assets/images").absolutePath,
                "gigagal.pack"
            )
        }
    }

    tasks.named('compileJava') {
        dependsOn tasks.named('packTextures')
    }
}

tasks.named('eclipse') {
    doLast {
        delete ".project"
    }
}
